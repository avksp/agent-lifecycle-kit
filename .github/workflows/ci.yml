name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned quality runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Restore versioned release test fixture
        run: python -m zipfile -e fixtures/release-2-16-tests.zip tasks/release-2-16
      - name: Install package
        run: python -m pip install -e .
      - name: Validate repository hygiene
        run: >-
          python tools/release/validate_repository_hygiene.py
          --root .
          --policy policy/repository-hygiene.json
          --ref HEAD
          --require-history
          --evidence work/ci/repository-hygiene.json
      - name: Require Node projection syntax and export smoke
        env:
          ALK_REQUIRE_NODE: "1"
        run: >-
          uv run --frozen --group quality --python ${{ matrix.python }}
          python -m unittest tests.adapters.test_opencode_projection_runtime -v
      - name: Run stdlib tests
        id: stdlib-tests
        run: >-
          uv run --frozen --group quality --python ${{ matrix.python }}
          python tools/ci/${{ runner.os == 'Windows' && 'run_parallel_unittest.py' || 'run_unittest.py' }}
          --start tests --top .
          --out work/ci/test-timings.json
      - name: Retain test timing evidence
        if: always() && steps.stdlib-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            work/ci/test-timings.json
            work/ci/test-timings/
          if-no-files-found: error
          retention-days: 14
      - name: Run security tests directly
        run: uv run --frozen --group quality --python ${{ matrix.python }} python -m unittest discover -s tests/security -t . -v
      - name: Validate model routing profile
        run: python -m agent_lifecycle model profile-check --profile profiles/model-routing-profile.v1.json
      - name: Run neutrality scan
        run: python -m agent_lifecycle.neutrality scan --scope tracked-release --policy policy/neutrality.policy.json --require-zero-findings
      - name: Validate module and package architecture
        run: >-
          python tools/release/validate_module_dependencies.py
          --package-root src/agent_lifecycle
          --policy policy/architecture-dependencies.json
          --require-acyclic-modules
          --require-acyclic-packages
          --evidence work/ci/module-dependencies.json
      - name: Validate workflow transition contract
        run: >-
          python tools/release/validate_workflow_transition_contract.py
          --package-root src/agent_lifecycle
          --evidence work/ci/workflow-transition-contract.json
      - name: Validate standard-library runtime boundary
        run: >-
          python tools/release/validate_stdlib_runtime_boundary.py
          --package-root src/agent_lifecycle
          --evidence work/ci/stdlib-runtime-boundary.json
      - name: Validate architecture complexity
        run: >-
          python tools/release/validate_architecture_complexity.py
          --package-root src/agent_lifecycle
          --policy policy/architecture-limits.json
          --evidence work/ci/architecture-complexity.json
