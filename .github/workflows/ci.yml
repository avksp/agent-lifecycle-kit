name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -t . -v
      - name: Run security tests directly
        run: python -m unittest discover -s tests/security -t . -v
      - name: Validate model routing profile
        run: python -m agent_lifecycle model profile-check --profile profiles/model-routing-profile.v1.json
      - name: Run neutrality scan
        run: python -m agent_lifecycle.neutrality scan --scope tracked-release --policy policy/neutrality.policy.json --require-zero-findings
