name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate publication versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/release/validate_publication_versions.py \
            --target-version "${RELEASE_TAG#v}" \
            --target-ref "${RELEASE_TAG}" \
            --evidence /tmp/publication-versions.json
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and smoke-test distribution
        run: python tests/package/run_packaging_smoke.py --dist-dir dist --evidence /tmp/packaging-smoke.json
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
