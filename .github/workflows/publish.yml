name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Validate release tag ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/release/validate_release_ref.py --tag "$RELEASE_TAG" --main-ref origin/main --evidence /tmp/release-ref.json
      - name: Validate publication versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/release/validate_publication_versions.py \
            --target-version "${RELEASE_TAG#v}" \
            --target-ref "${RELEASE_TAG}" \
            --evidence /tmp/publication-versions.json
      - name: Validate publication adoption
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/release/validate_publication_adoption.py \
            --target-version "${RELEASE_TAG#v}" \
            --evidence /tmp/publication-adoption.json
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and smoke-test distribution
        run: python tests/package/run_packaging_smoke.py --dist-dir dist --python python --evidence /tmp/packaging-smoke.json
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  agent-plugin:
    name: Build and publish Agent Plugins archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Validate release tag ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/release/validate_release_ref.py --tag "$RELEASE_TAG" --main-ref origin/main --evidence /tmp/release-ref-agent-plugin.json
      - name: Build, validate and upload portable archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"release tag is not an immutable semver tag: {tag!r}")
          print(tag[1:])
          PY
          )"
          ARCHIVE="/tmp/agent-lifecycle-kit-agent-plugin-${RELEASE_TAG}.zip"
          python tools/release/build_agent_plugin.py \
            --root . \
            --version "$VERSION" \
            --out /tmp/agent-lifecycle-kit-agent-plugin \
            --archive "$ARCHIVE"
          python tools/release/validate_agent_plugin.py \
            --root . \
            --package /tmp/agent-lifecycle-kit-agent-plugin \
            --archive "$ARCHIVE" \
            --version "$VERSION" \
            --evidence /tmp/agent-plugin-validation.json
          gh release upload "$RELEASE_TAG" "$ARCHIVE"
