      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.1"
      - name: Restore original disposable fixture
        run: python -m zipfile -e fixtures/release-2-16-tests.zip tasks/release-2-16
