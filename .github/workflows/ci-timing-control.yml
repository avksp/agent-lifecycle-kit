name: ci-timing-control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-diagnostic:
    name: immutable233-git-diagnostic / py3.11+3.15
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Set checkout byte policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6cd9a0f3524b55a9197bc543d629b6bc2ed3fd2
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare isolated observation script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/ci/git-diagnostic | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD 'work/ci/git-diagnostic/probe.py'), [Convert]::FromBase64String(''))
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Observe immutable Git helpers on Python3.11
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B work/ci/git-diagnostic/probe.py 3.11 '{"src/agent_lifecycle/accounting/declared_ledger_legacy.py":"2e40d0421c7d67367435422861557b2c7b74f73545e8f9049dfb4bb44abd2d23","src/agent_lifecycle/accounting/declared_ledger_records.py":"b8ef9a6d9a60fcd5d87c7bad494eec2ef81ca3443ddf29d865511714be9c3291","src/agent_lifecycle/contracts/authority_io.py":"b12171bfd5ecc8365149b8936bd838103af5b59d988f34a6c90f9cedf8a71aed"}'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - name: Observe immutable Git helpers on Python3.15
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B work/ci/git-diagnostic/probe.py 3.15 '{"src/agent_lifecycle/accounting/declared_ledger_legacy.py":"2e40d0421c7d67367435422861557b2c7b74f73545e8f9049dfb4bb44abd2d23","src/agent_lifecycle/accounting/declared_ledger_records.py":"b8ef9a6d9a60fcd5d87c7bad494eec2ef81ca3443ddf29d865511714be9c3291","src/agent_lifecycle/contracts/authority_io.py":"b12171bfd5ecc8365149b8936bd838103af5b59d988f34a6c90f9cedf8a71aed"}'
      - name: Preserve diagnostic, including incomplete results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: immutable233-windows-git-diagnostic-a1
          path: work/ci/git-diagnostic/
          if-no-files-found: error
          retention-days: 14
