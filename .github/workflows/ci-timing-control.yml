  release234-windows:
    if: inputs.mode == 'release-2-34'
    name: windows-git-launch-control / controller3.11 / worker3.15
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Install locked Python 3.11 controller environment
        env:
          UV_PROJECT_ENVIRONMENT: work/ci/release234-py311
        run: uv sync --frozen --group quality --python 3.11
      - name: Install locked Python 3.15 environment
        env:
          UV_PROJECT_ENVIRONMENT: work/ci/release234-py315
        run: uv sync --frozen --group quality --python 3.15
      - name: Select and bind accounting Git backend before measurement
        id: accounting-git
        shell: pwsh
        run: |
          $code = @'
          import hashlib, json, os, shutil, stat, subprocess
          from pathlib import Path
          wrapper = Path(shutil.which("git") or "")
          assert wrapper.is_absolute() and not wrapper.is_symlink() and stat.S_ISREG(wrapper.lstat().st_mode)
          def git_output(executable, *args):
              return subprocess.check_output([str(executable), *args], timeout=15).decode("utf-8").strip()
          exec_path = Path(git_output(wrapper, "--exec-path"))
          assert exec_path.is_absolute() and exec_path.name == "git-core" and exec_path.parent.name == "libexec"
          prefix = exec_path.resolve(strict=True).parents[1]
          backend = prefix / "bin" / "git.exe"
          assert not backend.is_symlink() and stat.S_ISREG(backend.lstat().st_mode)
          assert backend.resolve(strict=True).is_relative_to(prefix) and backend.is_absolute()
          wrapper_version, backend_version = git_output(wrapper, "--version"), git_output(backend, "--version")
          assert wrapper_version == backend_version
          metadata = {"schemaVersion": "alk-accounting-git-backend.v1", "sourceHead": os.environ["GITHUB_SHA"],
                      "execPath": str(exec_path), "wrapperVersion": wrapper_version, "backendVersion": backend_version,
                      "pathSha256": hashlib.sha256(os.environ["PATH"].encode()).hexdigest(),
                      "wrapper": {"path": str(wrapper), "sha256": hashlib.sha256(wrapper.read_bytes()).hexdigest()},
                      "backend": {"path": str(backend), "sha256": hashlib.sha256(backend.read_bytes()).hexdigest()}}
          with Path("work/ci/release234-git-backend.json").open("x", encoding="utf-8") as stream:
              json.dump(metadata, stream, sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("executable=" + str(backend) + "\n")
          print(json.dumps(metadata, sort_keys=True))
          '@
          & work/ci/release234-py311/Scripts/python.exe -c $code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows 3.15 prechecks then exactly three pairs
        env:
          ALK_ACCOUNTING_GIT_EXECUTABLE: ${{ steps.accounting-git.outputs.executable }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPERIMENT_NUMBER: ${{ inputs.experiment }}
          MEASUREMENT_DEADLINE: ${{ inputs.deadline_utc }}
        run: >-
          & work/ci/release234-py311/Scripts/python.exe tools/ci/measure_limited_usage.py
          --baseline "$env:BASELINE_SHA" --candidate "$env:CANDIDATE_SHA"
          --experiment "$env:EXPERIMENT_NUMBER" --mode paired
          --deadline-utc "$env:MEASUREMENT_DEADLINE"
          --out work/ci/release234-measurement.json
      - name: Verify bound Git executables and PATH after measurement
        if: always() && steps.accounting-git.outcome == 'success'
        shell: pwsh
        run: |
          $code = @'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.loads(Path("work/ci/release234-git-backend.json").read_bytes())
          observations = []
          for name in ("wrapper", "backend"):
              expected = metadata[name]
              try:
                  actual = hashlib.sha256(Path(expected["path"]).read_bytes()).hexdigest()
                  observations.append({"role": name, "sha256": actual, "unchanged": actual == expected["sha256"]})
              except OSError as error:
                  observations.append({"role": name, "sha256": None, "unchanged": False, "error": str(error)})
          value = {"executables": observations,
