name: ci-timing-control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Timing route (fixture profile is feasibility only)
        type: choice
        default: suite
        options: [suite, fixture-comparison, fixture-profile, fixture-profile-feasibility, release-2-34, release-2-35-diagnostic]
      baseline_sha:
        description: Exact baseline (2.27 legacy; published 2.33 for release-2-34)
        type: string
        default: ec5d8e5b118dc8a7f86de3b683ff2ed9a20993e5
      candidate_sha:
        description: Exact dispatched candidate commit (required for fixture routes)
        type: string
        default: ""
      experiment:
        description: Bounded candidate experiment number
        type: choice
        default: "1"
        options: ["1", "2", "3", "4", "5"]
      deadline_utc:
        description: Required for experiments3/4/5; UTC native task deadline (YYYY-MM-DDTHH:MM:SSZ)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  paired-windows311:
    if: inputs.mode != 'release-2-34' && inputs.mode != 'release-2-35-diagnostic'
    name: windows-paired-control / py3.11
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned quality runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Restore versioned release test fixture
        run: python -m zipfile -e fixtures/release-2-16-tests.zip tasks/release-2-16
      - name: Install package
        run: python -m pip install -e .
      - name: Validate repository hygiene
        run: >-
          python tools/release/validate_repository_hygiene.py
          --root .
          --policy policy/repository-hygiene.json
          --ref HEAD
          --require-history
          --evidence work/ci/repository-hygiene.json
      - name: Capture timing-control environment
        run: >-
          python -c "import json,os,pathlib,platform;
          p=pathlib.Path('work/ci/control-environment.json');
          v=dict(python=platform.python_version(),platform=platform.platform(),logicalCPUs=os.cpu_count(),
          environment={k:os.environ.get(k) for k in
          ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH','ImageOS','ImageVersion')});
          p.write_text(json.dumps(v,indent=2),encoding='utf-8')"
      - name: Run parallel stdlib tests
        id: parallel-tests
        if: inputs.mode == 'suite'
        run: >-
          uv run --frozen --group quality --python 3.11
          python tools/ci/run_parallel_unittest.py --start tests --top .
          --out work/ci/paired-parallel.json
      - name: Run serial stdlib tests
        if: inputs.mode == 'suite'
        run: >-
          uv run --frozen --group quality --python 3.11
          python tools/ci/run_unittest.py --start tests --top .
          --out work/ci/paired-serial.json
      - name: Measure three alternating serial fixture pairs
        id: fixture-pairs
        if: inputs.mode == 'fixture-comparison'
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPERIMENT_NUMBER: ${{ inputs.experiment }}
          MEASUREMENT_DEADLINE: ${{ inputs.deadline_utc }}
        run: >-
          uv run --frozen --group quality --python 3.11
          python tools/ci/measure_limited_usage.py
          --baseline "$env:BASELINE_SHA" --candidate "$env:CANDIDATE_SHA"
          --experiment "$env:EXPERIMENT_NUMBER" --mode paired
          --deadline-utc "$env:MEASUREMENT_DEADLINE"
          --out work/ci/limited-usage-pairs.json
      - name: Profile unchanged baseline fixture feasibility
        id: fixture-profile
        if: inputs.mode == 'fixture-profile'
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPERIMENT_NUMBER: ${{ inputs.experiment }}
        run: >-
          uv run --frozen --group quality --python 3.11
          python tools/ci/measure_limited_usage.py
          --baseline "$env:BASELINE_SHA" --candidate "$env:CANDIDATE_SHA"
          --experiment "$env:EXPERIMENT_NUMBER" --mode profile
          --out work/ci/limited-usage-profile.json
      - name: Retain paired control evidence
        if: always() && steps.parallel-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-windows-paired-control-py3.11
          path: |
            work/ci/paired-parallel.json
            work/ci/paired-parallel/
            work/ci/paired-serial.json
            work/ci/control-environment.json
          if-no-files-found: error
          retention-days: 14
      - name: Profile baseline and candidate feasibility on this runner
        id: fixture-feasibility
        if: inputs.mode == 'fixture-profile-feasibility'
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPERIMENT_NUMBER: ${{ inputs.experiment }}
        run: >-
          uv run --frozen --group quality --python 3.11
          python tools/ci/measure_limited_usage.py
          --baseline "$env:BASELINE_SHA" --candidate "$env:CANDIDATE_SHA"
          --experiment "$env:EXPERIMENT_NUMBER" --mode feasibility
          --out work/ci/limited-usage-feasibility.json
      - name: Retain bounded fixture measurement evidence
        if: >-
          always() && (steps.fixture-pairs.outcome != 'skipped' || steps.fixture-profile.outcome != 'skipped'
          || steps.fixture-feasibility.outcome != 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limited-usage-windows-py3.11-${{ inputs.mode }}-${{ inputs.experiment }}
          path: |
            work/ci/limited-usage-pairs.json
            work/ci/limited-usage-pairs/
            work/ci/limited-usage-profile.json
            work/ci/limited-usage-profile/
            work/ci/limited-usage-feasibility.json
            work/ci/limited-usage-feasibility/
            work/ci/control-environment.json
          if-no-files-found: error
          retention-days: 14

