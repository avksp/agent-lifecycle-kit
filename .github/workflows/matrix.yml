name: windows-coordinator-context-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diag/windows-coordinator-context-a3'
    name: Windows 3.12 original context comparison
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - name: Require admitted source branch scope and native cutoff
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          folder = Path('work/ci/windows-coordinator-context')
          folder.mkdir(parents=True, exist_ok=False)
          baseline = '4b00fbf36aafed734ee0320a248fce74f275d049'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/diag/windows-coordinator-context-a3'
          assert datetime.now(timezone.utc) < datetime.fromisoformat('2026-11-08T14:15:57.707586+00:00')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, 'HEAD'], check=True)
          changes = git('diff', '--name-only', baseline, 'HEAD').splitlines()
          assert changes == ['.github/workflows/matrix.yml'], changes
          expected = {'pyproject.toml': '4b96426f8dcef1691f52e97872ef12a036badb4eae2c24db6c9b0bdf3122b801', 'src/agent_lifecycle/contracts/private_storage.py': '356e80952d8cbad7450e0197f6dce4efcbdafda5c1d828c03412ce9117ae72c3', 'src/agent_lifecycle/contracts/windows_security.py': 'b84e63cf6fe1ded0adc65f723eb24bd593b765b349364aa3bc2506daf2301230', 'tests/accounting/test_declared_ledger.py': '65d6904ec8166d47ac665b4202572c672a2485d0d3e8b376ef77adfbb9ad914c', 'tools/ci/run_unittest.py': '055eb2501af84015d64b7c6ba294f90980dc8f6208c8e93ae967297c418ad17c', 'uv.lock': 'eb5a94bd0275a9ba18f0e89a5e785121fff45d2bf4543682ef03527b8b990680'}
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          receipt = dict(baseline=baseline, head=git('rev-parse', 'HEAD'), tree=git('rev-parse', 'HEAD^{tree}'),
                         files={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in [*expected, '.github/workflows/matrix.yml']})
          (folder / 'source.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
      - name: Restore versioned release test fixture
        run: python -m zipfile -e fixtures/release-2-16-tests.zip tasks/release-2-16
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Install original frozen quality environment
        run: uv sync --locked --group quality --python 3.12.10
      - name: Compare original discovery prefix against named target
