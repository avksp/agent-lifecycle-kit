st_closing_resources_recovery.RawRetentionWitnessTests.test_raw_self_hashed_lock_inventory_requires_exact_manifest_membership', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_raw_staging_collision_never_overwrites_unrelated_destination', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_raw_unavailable_runtime_clock_refuses_before_any_delete', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_raw_well_formed_other_plan_lock_refused_before_registration_or_unlink', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_retention_due_check_refuses_open_not_due_and_financial_exception', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_retention_late_exception_writer_fenced_through_recheck_and_unlink', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_retention_partial_unlink_restart_is_idempotent_and_done_requires_all_files', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_retention_private_authority_rejects_modes_and_every_pinned_identity', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_retention_sql_collected_raw_pending_enumerates_every_attempt', 'tests.accounting.test_closing_resources_recovery.RawRetentionWitnessTests.test_same_attempt_operations_retain_all_raw_obligations_and_original_summary', 'tests.accounting.test_deadline_clock.DeadlineClockTests.test_dd01_dd03_exact_utc_and_nondecending_high_water', 'tests.accounting.test_deadline_clock.DeadlineClockTests.test_dd16_expired_work_still_settles_and_revokes_without_new_grant', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_authority_candidate_refuses_broken_intermediate_predecessor', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_clock_rollback_refuses_snapshot_without_mutation', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_immutable_bootstrap_record_rejects_erasure', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_initial_root_request_refuses_current_operator_before_artifact_read', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_lost_reply_after_commit_replays_original_rotation', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_missing_bootstrap_cannot_self_select_root', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_persisted_authority_candidate_is_read_only_and_not_a_grant', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_process_contenders_cannot_both_install_epoch', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_public_install_refuses_new_issuer_with_existing_root', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_public_signed_revocation_remains_a_safety_operation', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_signed_grant_data_join_is_transaction_bound_and_never_native_permission', 'tests.accounting.test_workflow_authority_store.WorkflowAuthorityStoreTests.test_signed_successor_replay_and_revocation_monotonicity', 'tests.accounting.test_declared_ledger.CoordinatorDurabilityTests.test_changed_source_after_claim_refuses_without_head_mutation', 'tests.accounting.test_declared_ledger.CoordinatorDurabilityTests.test_concurrent_coordinator_claim_has_one_winner_and_no_double_charge'], 'target': 'tests.accounting.test_declared_ledger.CoordinatorDurabilityTests.test_concurrent_coordinator_claim_has_one_winner_and_no_double_charge'}
          config["runnerSHA256"] = '055eb2501af84015d64b7c6ba294f90980dc8f6208c8e93ae967297c418ad17c'
          cutoff = datetime.fromisoformat('2026-11-08T14:15:57.707586+00:00')
          python = Path(".venv/Scripts/python.exe").resolve()
          child = folder / "child.py"
          child.write_text('def main():\n    import argparse\n    import hashlib\n    import importlib.util\n    import json\n    from pathlib import Path\n    import platform\n    import sys\n    import time\n    import unittest\n\n    arm, config_name, report_name, detail_name = sys.argv[1:]\n    config = json.loads(Path(config_name).read_text(encoding="utf-8"))\n    root = Path.cwd().resolve()\n    sys.path[:0] = [str(root / "src"), str(root), str(root / "tools/ci")]\n    import agent_lifecycle\n    assert Path(agent_lifecycle.__file__).resolve().is_relative_to(root / "src")\n    assert platform.python_version() == "3.12.10"\n    runner_path = root / "tools/ci/run_unittest.py"\n    assert hashlib.sha256(runner_path.read_bytes()).hexdigest() == config["runnerSHA256"]\n    spec = importlib.util.spec_from_file_location("original_alk_ci_timing", runner_path)\n    timing = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(timing)\n    loader = unittest.TestLoader()\n    started = time.perf_counter()\n    target = config["target"]\n    removed = []\n    if arm == "A":\n        suite = loader.discover("tests", pattern="test*.py", top_level_dir=".")\n        def remove_new_diagnostics(node):\n            kept = []\n            for item in node:\n                if isinstance(item, unittest.TestSuite):\n                    remove_new_diagnostics(item)\n                    kept.append(item)\n                elif (type(item).__module__ == "tests.accounting.test_declared_ledger"\n                      and type(item).__qualname__ == "CoordinatorDiagnosticTests"):\n                    removed.append(item.id())\n                else:\n                    kept.append(item)\n            node._tests[:] = kept\n        remove_new_diagnostics(suite)\n        assert len(removed) == 5\n        ids = [entry["id"] for entry in timing.inventory(suite)]\n        identity = hashlib.sha256(json.dumps(ids, separators=(",", ":"), ensure_ascii=False).encode()).hexdigest()\n        assert len(ids) == config["originalInventoryCount"]\n        assert identity == config["originalInventoryIdHash"], (identity, config["originalInventoryIdHash"])\n        assert ids[:65] == config["prefixIds"]\n        class StopAfterTarget(timing.TimedResult):\n            def stopTest(self, test):\n                super().stopTest(test)\n                if test.id() == target:\n                    self.stop()\n        timing.TimedResult = StopAfterTarget\n    else:\n        assert arm == "B"\n        suite = loader.loadTestsFromName(target)\n        ids = [entry["id"] for entry in timing.inventory(suite)]\n        assert ids == [target]\n        identity = hashlib.sha256(json.dumps(ids, separators=(",", ":"), ensure_ascii=False).encode()).hexdigest()\n    details = {\n        "arm": arm, "python": platform.python_version(),\n        "librarySource": str(Path(agent_lifecycle.__file__).resolve().relative_to(root)),\n        "inventoryCount": len(ids), "inventoryIdHash": identity,\n        "removedDiagnosticIds": removed, "rawRunnerStatusUnmodified": True,\n        "rawRunnerReport": report_name,\n    }\n    with Path(detail_name).open("x", encoding="utf-8") as stream:\n        json.dump(details, stream, indent=2)\n    args = argparse.Namespace(start="tests", top=".", pattern="test*.py", worker_roster=None)\n    with Path(report_name).open("x+", encoding="utf-8") as report:\n        code = timing.run(args, report, prepared=(loader, suite, started))\n    raise SystemExit(code)\n\nif __name__ == \'__main__\':\n    main()\n', encoding="utf-8")
          config_path.write_text(json.dumps(config, indent=2), encoding="utf-8")
          assert platform.python_version() == "3.12.10"
          assert subprocess.check_output([str(python), "-c", "import platform; print(platform.python_version())"], text=True).strip() == "3.12.10"
          summary = dict(status="INCOMPLETE", pairs=[], attempts=[],
                         maxPairs=4, maxProcesses=8, maxSelectedCases=264, maxTargetExposures=8,
                         maxSamplingSeconds=600, maxProcessSeconds=120,
                         bugRepaired=False, rootCauseConfirmed=False, fullSuitePassClaimed=False,
                         originalBugStatus="OPEN", sha=os.environ["GITHUB_SHA"],
                         python=platform.python_version(), executable=str(python),
                         platform=platform.platform(), image=os.environ.get("ImageVersion"),
                         runner=os.environ.get("RUNNER_NAME"),
                         uv=subprocess.check_output(["uv", "--version"], text=True).strip(),
                         startedAt=datetime.now(timezone.utc).isoformat())
          version_tokens = summary["uv"].split()
          assert len(version_tokens) >= 2 and version_tokens[:2] == ["uv", "0.13.1"], summary["uv"]
          summary["uvVersion"] = version_tokens[1]
          sampling_start = time.monotonic()
          env = {**os.environ, "PYTHONDONTWRITEBYTECODE": "1",
                 "PYTHONPATH": os.pathsep.join(str(Path(p).resolve()) for p in ["src", ".", "tools/ci"])}
          def save_summary():
              summary["elapsedSeconds"] = time.monotonic() - sampling_start
              summary["finishedAt"] = datetime.now(timezone.utc).isoformat()
              (folder / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          def preserve(path, raw, cap):
              info = dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest(), truncated=len(raw) > cap)
              path.write_bytes(raw[:cap])
              info["storedSHA256"] = hashlib.sha256(path.read_bytes()).hexdigest()
              return info
          def assess(item, report, detail, stderr):
              expected = config["prefixIds"] if item["arm"] == "A" else [config["target"]]
              cases = report.get("cases", [])
              actual = [case.get("id") for case in cases]
              item["executedIds"] = actual
              item["testsRun"] = report.get("testsRun")
              item["rawRunnerStatus"] = report.get("status")
              item["rawCoverageComplete"] = report.get("coverage", {}).get("complete")
              item["targetEvents"] = [event for event in report.get("events", []) if event.get("id") == config["target"]]
              item["predecessorNonSuccessEvents"] = [
                  event for event in report.get("events", [])
                  if event.get("id") != config["target"]
                  and event.get("outcome") not in ("success", "subtest:success")
              ]
              if (actual != expected or report.get("testsRun") != len(expected)
                      or not all(case.get("completed") is True for case in cases)
                      or report.get("loaderErrors") or report.get("interrupted")
                      or report.get("skips") or report.get("unexpectedSuccesses")
                      or report.get("expectedFailures") or item["predecessorNonSuccessEvents"]
                      or len(item["targetEvents"]) != 1):
                  return "INCOMPLETE_CONTEXT_OR_EXECUTION_MISMATCH"
              target_outcome = item["targetEvents"][0]["outcome"]
              if target_outcome in ("failure", "error"):
                  text = stderr.decode("utf-8", errors="replace")
                  matched = all(marker in text for marker in (
                      "private-storage-unsafe", "Existing private directory is unsafe",
                      "FileExistsError", "authority output already exists",
                  ))
                  return "OBSERVED_MATCHED_ORIGINAL_TARGET_FAILURE" if matched else "OBSERVED_DIFFERENT_TARGET_FAILURE"
              if target_outcome != "success" or report.get("failures") or report.get("errors"):
                  return "INCOMPLETE_TARGET_OUTCOME"
              if item["arm"] == "A":
                  not_started = report.get("coverage", {}).get("notStarted", [])
                  if (detail.get("inventoryCount") != 4327 or len(detail.get("removedDiagnosticIds", [])) != 5
                          or detail.get("inventoryIdHash") != config["originalInventoryIdHash"]
                          or report.get("status") != "FAIL" or item["exitCode"] != 1
                          or report.get("coverage", {}).get("complete") is not False
                          or len(not_started) != 4262
                          or any(entry.get("reason") != "unaccounted" for entry in not_started)
                          or report.get("coverage", {}).get("unexpectedIds")):
                      return "INCOMPLETE_UNEXPECTED_RAW_PREFIX_STATUS"
                  return "SELECTED_PREFIX_PASS_RAW_FULL_SUITE_INCOMPLETE"
              return "SELECTED_TARGET_PASS" if (report.get("status") == "PASS" and item["exitCode"] == 0
                                                and report.get("coverage", {}).get("complete") is True) else "INCOMPLETE_TARGET_REPORT"
          exit_code = 0
          save_summary()
          for pair_index in range(1, 5):
              pair = dict(pair=pair_index, order=["A", "B"] if pair_index % 2 else ["B", "A"], attempts=[])
              summary["pairs"].append(pair)
              for arm in pair["order"]:
                  remaining = min(600 - (time.monotonic() - sampling_start),
                                  (cutoff - datetime.now(timezone.utc)).total_seconds())
                  if remaining <= 0:
                      summary["status"] = "INCOMPLETE_AGGREGATE_OR_AUTHORIZATION_TIMEOUT"
                      exit_code = 124
                      break
                  label = f"{pair_index:02}-{arm}"
                  report_path = folder / (label + ".timings.json")
                  detail_path = folder / (label + ".detail.json")
                  argv = [str(python), str(child), arm, str(config_path), str(report_path), str(detail_path)]
                  item = dict(pair=pair_index, arm=arm, label=label, argv=argv, timeout=False)
                  before = time.monotonic()
                  process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                             env=env, creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
                  try:
                      stdout, stderr = process.communicate(timeout=min(120, remaining))
                  except subprocess.TimeoutExpired:
                      item["timeout"] = True
                      cleanup = subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"],
                                               capture_output=True, timeout=10)
                      item["cleanupReturnCode"] = cleanup.returncode
                      stdout, stderr = process.communicate(timeout=5)
                  item.update(exitCode=process.returncode, elapsedSeconds=time.monotonic() - before)
                  item["stdout"] = preserve(folder / (label + ".stdout"), stdout, 2097152)
                  item["stderr"] = preserve(folder / (label + ".stderr"), stderr, 2097152)
                  for kind, path in [("report", report_path), ("detail", detail_path)]:
                      if path.exists():
                          raw = path.read_bytes()
                          item[kind] = preserve(path, raw, 8388608)
                      else:
                          item[kind] = dict(missing=True)
                  if item["timeout"]:
                      item["assessment"] = "INCOMPLETE_PROCESS_TIMEOUT"
                  elif any(item[kind].get("truncated") or item[kind].get("missing") for kind in ["stdout", "stderr", "report", "detail"]):
                      item["assessment"] = "INCOMPLETE_MISSING_OR_TRUNCATED_OUTPUT"
                  else:
                      try:
                          report = json.loads(report_path.read_text(encoding="utf-8"))
                          detail = json.loads(detail_path.read_text(encoding="utf-8"))
                          item["assessment"] = assess(item, report, detail, stderr)
                      except (ValueError, TypeError, KeyError) as exc:
                          item["assessment"] = "INCOMPLETE_INVALID_REPORT"
                          item["reportErrorType"] = type(exc).__name__
                  pair["attempts"].append(label)
                  summary["attempts"].append(item)
                  print(json.dumps(dict(label=label, exitCode=item["exitCode"], assessment=item["assessment"],
                                        elapsedSeconds=item["elapsedSeconds"])), flush=True)
                  save_summary()
              assessments = [item["assessment"] for item in summary["attempts"] if item["pair"] == pair_index]
              if len(assessments) != 2 or any(value.startswith("INCOMPLETE") for value in assessments):
                  summary["status"] = "INCOMPLETE_COMPARISON"
                  exit_code = exit_code or 2
                  break
              if any(value.startswith("OBSERVED_") for value in assessments):
                  summary["status"] = ("OBSERVED_MATCHED_ORIGINAL_TARGET_FAILURE" if any(
                      value == "OBSERVED_MATCHED_ORIGINAL_TARGET_FAILURE" for value in assessments)
                      else "OBSERVED_DIFFERENT_TARGET_FAILURE")
                  exit_code = 1
                  break
              summary["status"] = "INCONCLUSIVE_NO_RECURRENCE"
          save_summary()
          assert len(summary["attempts"]) <= 8
          assert sum(item.get("testsRun", 0) for item in summary["attempts"]) <= 264
          raise SystemExit(exit_code)
      - name: Preserve raw context data including incomplete full-suite statuses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-coordinator-context-${{ github.run_id }}
          path: work/ci/windows-coordinator-context/
          if-no-files-found: error
          retention-days: 30
