name: release-matrix-contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Restore versioned release test fixture
        run: python -m zipfile -e fixtures/release-2-16-tests.zip tasks/release-2-16
      - name: Install package
        run: python -m pip install -e .
      - name: Run conformance and lifecycle tests
        run: uv run --frozen --group quality --python ${{ matrix.python }} python -m unittest discover -s tests -t . -v
