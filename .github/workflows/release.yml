name: offline-release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: release/candidate/evidence
      RELEASE_NEUTRALITY_REPORT: release/candidate/evidence/release-neutrality-report.json
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate repository and publication-ref hygiene
        run: >-
          python tools/release/validate_repository_hygiene.py
          --root .
          --policy policy/repository-hygiene.json
          --ref HEAD
          --all-refs
          --require-history
          --evidence work/release-candidate/repository-hygiene.json
      - name: Prepare evidence directories
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("release/candidate/evidence")
          root.mkdir(parents=True, exist_ok=True)
          Path("release/candidate").mkdir(parents=True, exist_ok=True)
          for path in root.glob("*.json"):
              path.unlink()
          PY
      - name: Build and validate portable Agent Plugins candidate
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          python tools/release/build_agent_plugin.py \
            --root . \
            --version "$VERSION" \
            --out release/candidate/agent-plugin \
            --archive "release/candidate/agent-lifecycle-kit-agent-plugin-v${VERSION}.zip"
          python tools/release/validate_agent_plugin.py \
            --root . \
            --package release/candidate/agent-plugin \
            --archive "release/candidate/agent-lifecycle-kit-agent-plugin-v${VERSION}.zip" \
            --version "$VERSION" \
            --evidence "$EVIDENCE_DIR"/agent-plugin.json
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate model profile
        run: python -m agent_lifecycle model profile-check --profile profiles/model-routing-profile.v1.json
      - name: Validate digest authority
        run: python tests/contracts/run_digest_authority_check.py --evidence "$EVIDENCE_DIR"/digest-authority-tests.json
      - name: Validate support matrix contract
        run: python tools/release/validate_support_matrix.py --support-matrix docs/adapters/support-matrix.md --profile profiles/release/ci-matrix-profile.v2.json --evidence "$EVIDENCE_DIR"/support-matrix-contract.json
      - name: Validate deferred promotion contract
        run: python tools/release/validate_deferred_promotion.py --profile profiles/release/benchmark-authority-profile.v1.json --evidence "$EVIDENCE_DIR"/deferred-promotion-contract.json
      - name: Assemble offline candidate
        run: python tools/release/assemble_release_candidate.py --manifest profiles/release/source-release-profile.v1.json --inventory release/candidate/inventory.json --evidence "$EVIDENCE_DIR"/release-assembly.json
      - name: Verify offline candidate
        run: python tools/release/verify_release_candidate.py --inventory release/candidate/inventory.json --evidence "$EVIDENCE_DIR"/release-verification.json
      - name: Run release neutrality scan
        run: |
          python -c "from pathlib import Path; Path('$RELEASE_NEUTRALITY_REPORT').unlink(missing_ok=True)"
          python -m agent_lifecycle.neutrality scan --scope tracked-release --policy policy/neutrality.policy.json --report "$RELEASE_NEUTRALITY_REPORT" --require-zero-findings
      - name: Install build frontend
        run: python -m pip install build
      - name: Run packaging smoke
        run: python tests/package/run_packaging_smoke.py --dist-dir /tmp/agent-lifecycle-r03-dist --python python --evidence "$EVIDENCE_DIR"/packaging-smoke.json
