name: offline-release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: release/candidate/evidence
      RELEASE_NEUTRALITY_REPORT: release/candidate/evidence/release-neutrality-report.json
    steps:
      - name: Set git line ending policy
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e .
      - name: Prepare evidence directories
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("release/candidate/evidence")
          root.mkdir(parents=True, exist_ok=True)
          Path("release/candidate").mkdir(parents=True, exist_ok=True)
          for path in root.glob("*.json"):
              path.unlink()
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate model profile
        run: python -m agent_lifecycle model profile-check --profile profiles/model-routing-profile.v1.json
      - name: Validate digest authority
        run: python tests/contracts/run_digest_authority_check.py --evidence "$EVIDENCE_DIR"/digest-authority-tests.json
      - name: Validate support matrix contract
        run: python tools/release/validate_support_matrix.py --support-matrix docs/adapters/support-matrix.md --profile plans/standalone-v1/.agent-plan/standalone-v1/ci-matrix-profile.v2.json --evidence "$EVIDENCE_DIR"/support-matrix-contract.json
      - name: Validate deferred promotion contract
        run: python tools/release/validate_deferred_promotion.py --profile plans/standalone-v1/.agent-plan/standalone-v1/benchmark-authority-profile.v1.json --evidence "$EVIDENCE_DIR"/deferred-promotion-contract.json
      - name: Assemble offline candidate
        run: python tools/release/assemble_release_candidate.py --manifest plans/standalone-v1/plan.manifest.json --inventory release/candidate/inventory.json --evidence "$EVIDENCE_DIR"/release-assembly.json
      - name: Verify offline candidate
        run: python tools/release/verify_release_candidate.py --inventory release/candidate/inventory.json --evidence "$EVIDENCE_DIR"/release-verification.json
      - name: Run release neutrality scan
        run: |
          python -c "from pathlib import Path; Path('$RELEASE_NEUTRALITY_REPORT').unlink(missing_ok=True)"
          python -m agent_lifecycle.neutrality scan --scope current-tree-complete --policy policy/neutrality.policy.json --report "$RELEASE_NEUTRALITY_REPORT" --require-zero-findings
      - name: Verify historical standalone lineage guard
        run: |
          set +e
          python tools/release/verify_final_candidate.py --manifest plans/standalone-v1/plan.manifest.json --state plans/standalone-v1/workflow/run.state.json --release-evidence-dir "$EVIDENCE_DIR" --output "$EVIDENCE_DIR"/final-candidate-audit.json
          rc=$?
          set -e
          test "$rc" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("release/candidate/evidence/final-candidate-audit.json").read_text(encoding="utf-8"))
          codes = {item.get("code") for item in payload.get("blockers", [])}
          assert payload.get("status") == "FAIL", payload
          assert "lineage-check-failed" in codes, payload
          PY
      - name: Install build frontend
        run: python -m pip install build
      - name: Run packaging smoke
        run: python tests/package/run_packaging_smoke.py --dist-dir /tmp/agent-lifecycle-r03-dist --python python --evidence "$EVIDENCE_DIR"/packaging-smoke.json
