[build-system]
requires = ["setuptools>=70,<85", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lifecycle-kit"
version = "1.77.0"
description = "Provider-neutral lifecycle control layer that helps coding agents plan, execute, validate, and prove software tasks to completion."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Lifecycle Kit contributors" }]
keywords = [
  "adapter-conformance",
  "agent-lifecycle",
  "agent-workflows",
  "agents",
  "ai-agents",
  "audit",
  "coding-agents",
  "lifecycle",
  "model-routing",
  "planning",
  "sdd",
  "software-delivery",
  "task-orchestration",
  "workflow",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[dependency-groups]
quality = [
  "ruff==0.16.3",
  "mypy==1.17.1",
  "coverage==7.10.6",
]

[project.scripts]
agent-lifecycle = "agent_lifecycle.cli:main"
agent-lifecycle-neutrality = "agent_lifecycle.neutrality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_lifecycle = ["py.typed", "data/profiles/**/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF", "SIM", "PTH", "ARG", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["agent_lifecycle"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/agent_lifecycle"]
ignore_missing_imports = true
show_error_codes = true

[tool.setuptools.data-files]
"benchmarks/reference-tasks" = [
  "benchmarks/reference-tasks/README.md",
  "benchmarks/reference-tasks/manifest.json",
]
"benchmarks/reference-tasks/rt01-planning" = [
  "benchmarks/reference-tasks/rt01-planning/task.md",
  "benchmarks/reference-tasks/rt01-planning/oracle.json",
]
"benchmarks/reference-tasks/rt02-architecture-review" = [
  "benchmarks/reference-tasks/rt02-architecture-review/task.md",
  "benchmarks/reference-tasks/rt02-architecture-review/oracle.json",
]
"benchmarks/reference-tasks/rt03-bug-forensics" = [
  "benchmarks/reference-tasks/rt03-bug-forensics/task.md",
  "benchmarks/reference-tasks/rt03-bug-forensics/oracle.json",
]
"benchmarks/reference-tasks/rt04-s1-managed-task" = [
  "benchmarks/reference-tasks/rt04-s1-managed-task/task.md",
  "benchmarks/reference-tasks/rt04-s1-managed-task/oracle.json",
]
"benchmarks/reference-tasks/rt05-s2-evidence-task" = [
  "benchmarks/reference-tasks/rt05-s2-evidence-task/task.md",
  "benchmarks/reference-tasks/rt05-s2-evidence-task/oracle.json",
]
