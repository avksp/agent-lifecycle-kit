    <g transform="translate(78 568)">
      <rect width="476" height="38" rx="10" fill="#111923" stroke="#2d3d52"/>
      <text x="20" y="25" font-size="17" fill="#d7e2ee">github.com/avksp/agent-lifecycle-kit</text>
